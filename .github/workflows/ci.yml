name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - v2.1.0
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - 'maps/**'
      - 'CREDITS'
      - 'LICENSE'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - 'maps/**'
      - 'CREDITS'
      - 'LICENSE'
      - '**.md'

env:
  BUILD_TYPE: Release
  BUILD_DIR: ${{github.workspace}}/build

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            cores_cmd: echo $env:NUMBER_OF_PROCESSORS
          - os: macos-latest
            cores_cmd: sysctl -n hw.logicalcpu
          - os: ubuntu-latest
            cores_cmd: nproc

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B "${{env.BUILD_DIR}}" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build "${{env.BUILD_DIR}}" --config ${{env.BUILD_TYPE}} --parallel $(${{ matrix.cores_cmd }})

  ladder_build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake \
            -B "${{env.BUILD_DIR}}" \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DBUILD_SC2_RENDERER=OFF \
            -DBUILD_API_EXAMPLES=OFF \
            -DBUILD_API_TESTS=OFF \
            -DSC2_VERSION=4.10.0

      - name: Build
        run: cmake --build "${{env.BUILD_DIR}}" --config ${{env.BUILD_TYPE}} --parallel $(nproc)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pre-commit/action@v3.0.1
